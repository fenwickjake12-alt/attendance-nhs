<!DOCTYPE html>
<html>
<head>
  <title>NHS Attendance</title>
</head>
<body>

<h2>NHS Attendance Check-In</h2>

<p id="status">Checking location...</p>

<div id="form" style="display:none;">
  <input id="name" placeholder="Full Name"><br><br>
  <input id="code" placeholder="Access Code"><br><br>
  <button onclick="submitAttendance()">Submit</button>
</div>

<script>
  // ====== CONFIGURATION ======
  const SCHOOL_LAT = 42.579067;   // Replace with your school latitude
  const SCHOOL_LON = -82.994902;  // Replace with your school longitude
  const RADIUS = 1000;           // Radius in meters (how far from school is allowed)
  const ACCESS_CODE = "NHS214"; // Change for each meeting
  const FLOW_URL = "https://script.google.com/macros/s/AKfycbw9iJGJK0KKS-tfjvb8L9iZcNcrtS_6KKnYbP5JhiGbyfDONiDzXWJ4ROzoEgLmFTDy/exec"; // Power Automate HTTP POST URL
  // ===========================

  // Function to calculate distance between two coordinates in meters
  function distance(lat1, lon1, lat2, lon2) {
    const R = 6371000; // Earth's radius in meters
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;
    const a = Math.sin(dLat/2)**2 +
              Math.cos(lat1*Math.PI/180) *
              Math.cos(lat2*Math.PI/180) *
              Math.sin(dLon/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Check user's location when page loads
  navigator.geolocation.getCurrentPosition(pos => {
    const d = distance(
      SCHOOL_LAT, SCHOOL_LON,
      pos.coords.latitude,
      pos.coords.longitude
    );

    if (d <= RADIUS) {
      document.getElementById("status").innerText = "Location verified. You may sign in.";
      document.getElementById("form").style.display = "block";
    } else {
      document.getElementById("status").innerText = "You are not at the meeting location.";
    }
  }, () => {
    document.getElementById("status").innerText = "Location access denied. Enable GPS to sign in.";
  });

  // Submit attendance
  function submitAttendance() {
    const name = document.getElementById("name").value;
    const code = document.getElementById("code").value;

    if (!name) {
      alert("Please enter your name.");
      return;
    }

    if (code !== ACCESS_CODE) {
      alert("Invalid access code.");
      return;
    }

    navigator.geolocation.getCurrentPosition(pos => {
      fetch(FLOW_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          name: name,
          lat: pos.coords.latitude,
          lon: pos.coords.longitude
        })
      }).then(() => {
        alert("Attendance recorded successfully!");
        document.getElementById("form").style.display = "none";
        document.getElementById("status").innerText = "Thank you!";
      }).catch(err => {
        alert("Error submitting attendance: " + err);
      });
    });
  }
</script>

</body>

</html>
