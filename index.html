<!DOCTYPE html>
<html>
<head>
  <title>NHS Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
    }

    h2 {
      margin-top: 0;
      color: #2a5298;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2a5298;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1e3c72;
    }

    .status {
      margin-top: 15px;
      font-weight: bold;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>National Honor Society</h2>
    <p>Please sign in to record your attendance</p>

    <input id="name" placeholder="Full Name">
    <input id="code" placeholder="Access Code" type="password">

    <button onclick="submitAttendance()">Submit Attendance</button>

    <div class="status" id="status"></div>

    <div class="footer">
      Location required • One submission per meeting
    </div>
  </div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbw9iJGJK0KKS-tfjvb8L9iZcNcrtS_6KKnYbP5JhiGbyfDONiDzXWJ4ROzoEgLmFTDy/exec";
const ACCESS_CODE = "NHS2026";
const MEET_LAT = 42.5790;
const MEET_LON = -82.9949;
const RADIUS = 0.002;

function submitAttendance() {
  document.getElementById("status").innerText = "Checking location...";

  if(document.getElementById("code").value !== ACCESS_CODE){
    document.getElementById("status").innerText = "❌ Wrong access code";
    return;
  }

  navigator.geolocation.getCurrentPosition(pos => {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    if(Math.abs(lat - MEET_LAT) > RADIUS || Math.abs(lon - MEET_LON) > RADIUS){
      document.getElementById("status").innerText = "❌ You are not at the meeting location";
      return;
    }

    fetch(SHEET_URL, {
      method: "POST",
      body: JSON.stringify({
        name: document.getElementById("name").value,
        lat: lat,
        lon: lon
      })
    }).then(() => {
      document.getElementById("status").innerText = "✅ Attendance recorded!";
    });
  });
}
</script>
</body>
</html>
