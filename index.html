<script>
  // ====== CONFIGURATION ======
  const SCHOOL_LAT = 42.579067;
  const SCHOOL_LON = -82.994902;
  const RADIUS = 1000; // meters
  const ACCESS_CODE = "NHS214";
  const FLOW_URL = "https://script.google.com/macros/s/AKfycbw9iJGJK0KKS-tfjvb8L9iZcNcrtS_6KKnYbP5JhiGbyfDONiDzXWJ4ROzoEgLmFTDy/exec";
  // ===========================

  let userLat = null;
  let userLon = null;
  let locationVerified = false;

  // Distance calculator
  function distance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2-lat1) * Math.PI/180;
    const dLon = (lon2-lon1) * Math.PI/180;

    const a =
      Math.sin(dLat/2) * Math.sin(dLat/2) +
      Math.cos(lat1*Math.PI/180) *
      Math.cos(lat2*Math.PI/180) *
      Math.sin(dLon/2) *
      Math.sin(dLon/2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  // Verify location
  function verifyLocation() {

    document.getElementById("status").innerText = "Checking location...";

    navigator.geolocation.getCurrentPosition(
      function(pos) {

        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;

        const d = distance(SCHOOL_LAT, SCHOOL_LON, userLat, userLon);

        if (d <= RADIUS) {
          locationVerified = true;
          document.getElementById("status").innerText =
            "✅ Location verified. You may sign in.";
          document.getElementById("form").style.display = "block";
        }
        else {
          locationVerified = false;
          document.getElementById("status").innerText =
            "❌ You are not at the meeting location.";
        }
      },

      function(error) {
        document.getElementById("status").innerText =
          "❌ Please enable location services.";
      }
    );
  }

  // Run location check on load
  verifyLocation();

  // Submit attendance
  function submitAttendance() {

    const name = document.getElementById("name").value;
    const code = document.getElementById("code").value;

    if (!locationVerified) {
      alert("Location not verified.");
      return;
    }

    if (!name) {
      alert("Enter your name.");
      return;
    }

    if (code !== ACCESS_CODE) {
      alert("Invalid access code.");
      return;
    }

    fetch(FLOW_URL, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        name: name,
        lat: userLat,
        lon: userLon
      })
    })
    .then(response => response.text())
    .then(data => {

      document.getElementById("status").innerText =
        "✅ Attendance recorded successfully!";

      document.getElementById("form").style.display = "none";
    })
    .catch(error => {
      alert("Submission failed: " + error);
    });

  }
</script>
