<!DOCTYPE html>
<html>
<head>
  <title>NHS Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

<h2>NHS Attendance Check-In</h2>

<p id="status">Checking location...</p>

<div id="form" style="display:none;">
  <input id="name" placeholder="Full Name"><br><br>
  <input id="code" placeholder="Access Code"><br><br>
  <button onclick="submitAttendance()">Submit</button>
</div>

<script>

const SCHOOL_LAT = 42.579067;
const SCHOOL_LON = -82.994902;
const RADIUS = 1000;
const ACCESS_CODE = "NHS214";
const FLOW_URL = "https://script.google.com/macros/s/AKfycbx7lBBddX8jWLMRbaKabgTqVV_yebqngJmH9oLcEgej_U93YRfNMlT11GsuAcKrD14G/exec";

let userLat = null;
let userLon = null;
let locationVerified = false;

function distance(lat1, lon1, lat2, lon2) {

  const R = 6371000;

  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) *
    Math.sin(dLon/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

  return R * c;
}

function verifyLocation() {

  document.getElementById("status").innerText = "Checking location...";

  navigator.geolocation.getCurrentPosition(

    function(position) {

      userLat = position.coords.latitude;
      userLon = position.coords.longitude;

      const d = distance(SCHOOL_LAT, SCHOOL_LON, userLat, userLon);

      if (d <= RADIUS) {

        locationVerified = true;

        document.getElementById("status").innerText =
          "Location verified. You may sign in.";

        document.getElementById("form").style.display = "block";

      } else {

        document.getElementById("status").innerText =
          "You are not at the meeting location.";

      }

    },

    function(error) {

      document.getElementById("status").innerText =
        "Please allow location access.";

    }

  );
}

verifyLocation();

function submitAttendance() {

  const name = document.getElementById("name").value;
  const code = document.getElementById("code").value;

  if (!locationVerified) {

    alert("Location not verified.");
    return;

  }

  if (name === "") {

    alert("Enter your name.");
    return;

  }

  if (code !== ACCESS_CODE) {

    alert("Invalid access code.");
    return;

  }

  fetch(FLOW_URL, {

    method: "POST",

    headers: {
      "Content-Type": "application/json"
    },

    body: JSON.stringify({
      name: name,
      lat: userLat,
      lon: userLon
    })

  })

  .then(function(response) {

    document.getElementById("status").innerText =
      "Attendance recorded successfully.";

    document.getElementById("form").style.display = "none";

  })

  .catch(function(error) {

    alert("Error submitting attendance.");

  });

}

</script>

</body>
</html>
